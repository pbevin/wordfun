name: Deploy

# Deploys to Fly.io after the Tests workflow passes on main.
# Can also be run by hand from the Actions tab ("Run workflow").
on:
  workflow_run:
    workflows: [Tests]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: fly-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      SOURCE_COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
    - name: Check for Fly token
      id: token
      run: |
        if [ -z "$FLY_API_TOKEN" ]; then
          echo "::warning::FLY_API_TOKEN secret is not set; skipping deploy."
          echo "present=false" >> "$GITHUB_OUTPUT"
        else
          echo "present=true" >> "$GITHUB_OUTPUT"
        fi
    - uses: actions/checkout@v5
      if: steps.token.outputs.present == 'true'
      with:
        ref: ${{ env.SOURCE_COMMIT }}
    - uses: superfly/flyctl-actions/setup-flyctl@master
      if: steps.token.outputs.present == 'true'
    - name: Deploy
      if: steps.token.outputs.present == 'true'
      run: flyctl deploy --remote-only --build-arg SOURCE_COMMIT="$SOURCE_COMMIT"
    - name: Check live version
      if: steps.token.outputs.present == 'true'
      run: |
        for i in 1 2 3 4 5 6; do
          live=$(curl -fsS https://wordfun.ca/version.txt || true)
          echo "live: $live"
          [ "$live" = "$SOURCE_COMMIT" ] && exit 0
          sleep 10
        done
        echo "::error::wordfun.ca/version.txt does not show $SOURCE_COMMIT"
        exit 1
